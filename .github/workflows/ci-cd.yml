name: CI/CD Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Validar e empacotar
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: mp4-sync/requirements-lock.txt
      - name: Instalar dependencias fixadas
        run: python -m pip install -r mp4-sync/requirements-lock.txt
      - name: Verificar dependencias e sintaxe
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q mp4-sync scripts
      - name: Executar testes offline
        run: python -m unittest discover -s mp4-sync -p "test_*.py" -v
      - name: Testar integridade da distribuicao e verificacao do deploy
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Verificar interface Tkinter sem abrir o aplicativo
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/mp4-sync"
          python -c "import app, tkinter as tk; root = tk.Tk(); root.withdraw(); root.update_idletasks(); root.destroy(); print('Imports e Tkinter OK')"
      - name: Empacotar a versao testada
        run: python scripts/package_release.py --commit "${{ github.sha }}"
      - name: Validar pagina de distribuicao
        run: python scripts/build_site.py
      - name: Testar o pacote extraido
        run: |
          Expand-Archive dist/JS12-Sync-Windows.zip -DestinationPath package-check
          python -m unittest discover -s package-check/JS12-Sync/mp4-sync -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/JS12-Sync-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  cd:
    name: Publicar e verificar no Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Disparar deploy e verificar commit e download publicados
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SITE_URL: ${{ vars.RENDER_SITE_URL }}
        run: python scripts/deploy_render.py
