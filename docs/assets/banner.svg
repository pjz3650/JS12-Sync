<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">JS12 Sync</title>
  <desc id="desc">Suas playlists, no ritmo do seu player. Um aplicativo Windows para sincronizar MP3 por USB.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#132f38"/></linearGradient>
    <linearGradient id="accent" x2="0" y2="1"><stop stop-color="#6df0bf"/><stop offset="1" stop-color="#30bac4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="52" width="236" height="30" rx="15" fill="#6df0bf" fill-opacity=".1"/>
    <text x="82" y="72" font-size="13" letter-spacing="2" font-weight="700" fill="#81ebca">WINDOWS · PYTHON · USB</text>
    <text x="60" y="164" font-size="76" letter-spacing="-3" font-weight="700" fill="#f3fafc">JS12<tspan fill="#6df0bf"> Sync</tspan></text>
    <text x="64" y="213" font-size="26" fill="#d3e5ea">Suas playlists, no ritmo do seu player.</text>
    <text x="64" y="250" font-size="18" fill="#92b3c1">Selecione no PC. Sincronize por USB. Escute offline.</text>
    <path d="M65 312h29m11 0h16m11 0h38" fill="none" stroke="#6df0bf" stroke-width="4" stroke-linecap="round"/>
    <text x="188" y="318" font-size="14" letter-spacing="1" fill="#92b3c1">PROJETO EXPERIMENTAL</text>
  </g>
  <g transform="translate(855 39)">
    <rect x="12" y="12" width="195" height="302" rx="28" fill="#071420" fill-opacity=".5"/>
    <rect width="195" height="302" rx="28" fill="#1b3346" stroke="#4d6d7c" stroke-width="2"/>
    <rect x="17" y="23" width="161" height="142" rx="12" fill="#0b1928"/>
    <text x="31" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#93bdc6">MINHAS PLAYLISTS</text>
    <g stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
      <path d="M36 101v18m17-37v55m18-69v82m18-56v29m18-43v57m18-71v84m18-62v40m17-26v12"/>
    </g>
    <circle cx="98" cy="225" r="43" fill="#0b1928" stroke="#436879"/>
    <circle cx="98" cy="225" r="23" fill="url(#accent)"/>
    <path d="m93 215 14 10-14 10z" fill="#102434"/>
    <path d="M-75 184h-41v-61h-34m75 61-12-12m12 12-12 12" fill="none" stroke="#6df0bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
